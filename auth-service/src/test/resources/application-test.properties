# In-memory DB in PostgreSQL mode: the same Flyway migration runs, no Docker or shared DB needed
spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
tether.jwt.secret=test-secret-that-is-at-least-32-bytes-long!!
