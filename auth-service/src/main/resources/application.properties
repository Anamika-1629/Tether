server.port=8081
spring.application.name=auth-service

# Defaults match docker-compose.yml. Point DB_* at the shared Supabase instance via env vars (see .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentsync}
spring.datasource.username=${DB_USER:incidentsync}
spring.datasource.password=${DB_PASSWORD:incidentsync}

# Schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Keep this service's migration history separate from other services on the shared DB
spring.flyway.table=auth_schema_history
# Shared DB already contains other services' tables. Baseline at 0 so our V1 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT. Every service that validates tokens must use the SAME secret (HS256, at least 32 bytes).
# The default is for local dev only. Set JWT_SECRET for anything shared.
tether.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
tether.jwt.issuer=${JWT_ISSUER:tether-auth}
tether.jwt.ttl=${JWT_TTL:PT1H}

# Comma-separated list of frontend origins allowed to call this service from the browser
tether.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management.endpoints.web.exposure.include=health,info
