server.port=8082
spring.application.name=incident-service

# Defaults match docker-compose.yml. Override via DB_* env vars, or SPRING_DATASOURCE_* as the compose file does
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentsync}
spring.datasource.username=${DB_USER:incidentsync}
spring.datasource.password=${DB_PASSWORD:incidentsync}

# Schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Keep this service's migration history separate from other services on the shared DB
spring.flyway.table=incident_schema_history
# Shared DB may already contain other services' tables. Baseline at 0 so our V1 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT validation. MUST match auth-service: same secret (HS256, >= 32 bytes) and same issuer.
# The default is the same dev-only value auth-service uses; set JWT_SECRET for anything shared.
tether.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
tether.jwt.issuer=${JWT_ISSUER:tether-auth}

# Comma-separated list of frontend origins allowed to call this service from the browser
tether.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
