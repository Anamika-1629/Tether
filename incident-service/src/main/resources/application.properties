server.port=8082
spring.application.name=incident-service

# Defaults match docker-compose.yml. Override via DB_* env vars, or SPRING_DATASOURCE_* as the compose file does
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentsync}
spring.datasource.username=${DB_USER:incidentsync}
spring.datasource.password=${DB_PASSWORD:incidentsync}

# Schema is owned by Flyway, Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
# Keep this service's migration history separate from other services on the shared DB
spring.flyway.table=incident_schema_history
# Shared DB may already contain other services' tables. Baseline at 0 so our V1 still runs.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
