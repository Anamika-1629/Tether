# In-memory DB in PostgreSQL mode. The real Flyway migration uses plpgsql triggers H2 can't run,
# so tests let Hibernate build the schema instead. (The append-only trigger is not covered here.)
spring.datasource.url=jdbc:h2:mem:incident;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
tether.jwt.secret=test-secret-that-is-at-least-32-bytes-long!!
tether.jwt.issuer=tether-auth
