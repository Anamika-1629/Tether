name: sync-service

on:
  push:
    branches: [main]
    paths: ["sync-service/**", ".github/workflows/sync-service.yml"]
  pull_request:
    paths: ["sync-service/**", ".github/workflows/sync-service.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: ./mvnw -B test
