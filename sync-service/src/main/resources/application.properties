server.port=8083
spring.application.name=sync-service

# Redis configuration for multi-instance sync and awareness Pub/Sub
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT validation. MUST match auth-service and incident-service: same secret (HS256) and same issuer
tether.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
tether.jwt.issuer=${JWT_ISSUER:tether-auth}

# Incident Service URL for verifying tenant incident access
tether.incident.service-url=${INCIDENT_SERVICE_URL:http://localhost:8082}
tether.incident.check-enabled=${INCIDENT_CHECK_ENABLED:true}

# Comma-separated list of allowed origins for WebSocket connections
tether.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Redis Pub/Sub topic for cross-instance sync events
tether.sync.redis-topic=${SYNC_REDIS_TOPIC:tether:sync:events}

# Observability (NFR2)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
