server.port=8083
spring.application.name=sync-service

# Redis configuration for multi-instance sync and awareness Pub/Sub
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Set REDIS_SSL=true for Upstash and other managed Redis that requires TLS
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# Fail fast instead of hanging a WebSocket thread when Redis is down
spring.data.redis.timeout=${REDIS_TIMEOUT_MS:2000}ms
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT_MS:2000}ms
# After a failed publish, skip Redis for this long before trying again
tether.sync.redis-retry-cooldown-ms=${SYNC_REDIS_RETRY_COOLDOWN_MS:5000}

# JWT validation. MUST match auth-service and incident-service: same secret (HS256) and same issuer
tether.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-0123456789}
tether.jwt.issuer=${JWT_ISSUER:tether-auth}

# Incident Service URL for verifying tenant incident access
tether.incident.service-url=${INCIDENT_SERVICE_URL:http://localhost:8082}
tether.incident.check-enabled=${INCIDENT_CHECK_ENABLED:true}
# Timeouts for the access check. On timeout the connection is rejected with a retryable close code (fail closed).
tether.incident.connect-timeout-ms=${INCIDENT_CONNECT_TIMEOUT_MS:2000}
tether.incident.read-timeout-ms=${INCIDENT_READ_TIMEOUT_MS:3000}

# Comma-separated list of allowed origins for WebSocket connections
tether.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Redis Pub/Sub topic for cross-instance sync events
tether.sync.redis-topic=${SYNC_REDIS_TOPIC:tether:sync:events}

# Observability (NFR2)
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
# Tag every series with the service name so one Prometheus can scrape all services
management.metrics.tags.application=${spring.application.name}

# WebSocket heartbeat: ping every interval, drop sessions silent for longer than the timeout
tether.sync.heartbeat-interval-ms=${SYNC_HEARTBEAT_INTERVAL_MS:10000}
tether.sync.heartbeat-timeout-ms=${SYNC_HEARTBEAT_TIMEOUT_MS:30000}

# Update log (A3): where each room's Yjs history is kept so it survives restarts and is shared by all instances.
#   redis  = Redis lists (default; needs REDIS_HOST/PORT, add spring.data.redis.ssl.enabled=true for Upstash)
#   memory = process-local, for tests or running without Redis (history lost on restart, not shared)
tether.sync.store=${SYNC_STORE:redis}
# Idle rooms' history expires this long after the last edit (0 = never). Accepts 30d, 12h, ...
tether.sync.log-ttl=${SYNC_LOG_TTL:30d}
# When a room's log reaches this many entries, ask a client for a full-state snapshot (0 = never compact)
tether.sync.compact-threshold=${SYNC_COMPACT_THRESHOLD:200}
# Newest entries kept as-is when compacting (covers updates still in flight from other instances)
tether.sync.compact-keep-tail=${SYNC_COMPACT_KEEP_TAIL:25}
# Largest WebSocket binary frame accepted. Tomcat's default (8 KB) would drop clients whose document
# is bigger than that, which also breaks snapshots.
tether.sync.max-message-bytes=${SYNC_MAX_MESSAGE_BYTES:1048576}
